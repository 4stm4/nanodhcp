name: release

# Build static musl binaries and attach them to the GitHub Release when a
# version tag is pushed. Static musl means a single self-contained binary with
# no libc dependency — ideal for the embedded-Linux / appliance use case.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets

jobs:
  # Don't ship a tag that does not pass tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test

  upload:
    needs: test
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      # Builds with the release profile (LTO, stripped), archives as
      # nanodhcp-<tag>-<target>.tar.gz with a .sha256, and uploads to the
      # release for the tag. The action installs the target and uses `cross`
      # automatically for the non-native aarch64 build.
      - name: Build and upload static binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: nanodhcp
          target: ${{ matrix.target }}
          archive: nanodhcp-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
