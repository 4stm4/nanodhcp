# nanodhcp example configuration
#
# Format: one `key=value` per line. Blank lines are ignored; a line whose
# first non-space character is `#` is a comment. Unknown keys are an error.

# Interface to serve on (Linux: SO_BINDTODEVICE).
interface=eth0

# This server's own address (DHCP option 54, Server Identifier).
server_ip=192.168.10.1

# The served subnet, in CIDR form, and its mask. The two must agree.
subnet=192.168.10.0/24
subnet_mask=255.255.255.0

# Dynamic pool (inclusive). Addresses outside it are never handed out.
pool_start=192.168.10.100
pool_end=192.168.10.200

# Default gateway (option 3) and DNS servers (option 6, comma-separated).
router=192.168.10.1
dns=192.168.10.1,1.1.1.1

# Lease duration in seconds (option 51). 86400 = 24h.
lease_time=86400

# Where dynamic leases are persisted.
lease_file=/var/lib/nanodhcp/leases

# Abort if binding the socket to `interface` fails (default). Set to true to
# fall back to serving on 0.0.0.0 instead — convenient on a multi-purpose host,
# risky on an appliance.
# allow_unbound=false

# Fixed bindings: static=<name>,<mac>,<ip>. The IP must be inside the subnet
# and is excluded from the dynamic pool automatically.
static=nas,aa:bb:cc:dd:ee:ff,192.168.10.10
static=printer,11:22:33:44:55:66,192.168.10.11
